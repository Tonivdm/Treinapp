<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Volgende trein &amp; metro</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1a1a1a;--mu:#6b6b66;--ac:#0063d3;--bad:#c62828;--ln:#e4e4de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mu:#9a9a94;--ac:#5aa2ff;--bad:#ff6b6b;--ln:#2e2e2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:20px 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:4px 14px}
.menu{background:var(--card);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:end}
.menu label{grid-column:1/-1;font-size:13px;color:var(--mu);margin-top:6px}.menu label:first-child{margin-top:0}
.menu input{grid-column:1}.menu #swap{grid-column:2;grid-row:3;margin:0;padding:10px 12px;background:var(--ln);color:var(--tx)}
.menu #zoek{grid-column:1/-1}
.rij{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--ln)}
.rij:last-child{border:0}.t{font-weight:700;font-size:18px;min-width:52px;font-variant-numeric:tabular-nums}
.v{color:var(--bad);font-size:13px}.r{flex:1}.m{color:var(--mu);font-size:13px}.x{text-decoration:line-through}
.leeg,.fout{padding:12px 0;color:var(--mu)}.fout{color:var(--bad)}
details{margin-top:20px}summary{color:var(--ac);cursor:pointer}
label{display:block;margin:10px 0 2px;font-size:13px;color:var(--mu)}
input[type=checkbox]{width:auto;margin:0}
.menu label.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Volgende trein &amp; metro</h1>
<div class="menu">
  <label for="station">Van (startstation)</label>
  <input id="station" list="dl1" autocomplete="off" placeholder="bijv. Delft">
  <label for="best">Naar (eindstation, meerdere mogelijk met komma)</label>
  <input id="best" list="dl2" autocomplete="off" placeholder="bijv. Rotterdam Centraal">
  <button id="swap" title="Omdraaien" aria-label="Van en naar omdraaien">⇅</button>
  <label class="chk"><input type="checkbox" id="overstap"> Ook treinen met overstap tonen</label>
  <button id="zoek">Toon treinen</button>
</div>
<datalist id="dl1"></datalist><datalist id="dl2"></datalist>
<h2 id="th">Treinen</h2><div class="card" id="treinen"></div>
<h2 id="mh">Metro</h2><div class="card" id="metros"></div>
<p class="m" id="upd"></p>
<details id="inst"><summary>Instellingen</summary>
<label>Worker-URL</label><input id="base" placeholder="https://jouw-worker.jouwnaam.workers.dev">
<label>Metronaam</label><input id="mnaam">
<label>Metro-codes (TPC, komma-gescheiden, via ovzoeker.nl)</label><input id="mcodes" placeholder="31001234,31001235">
<button id="opsl">Opslaan</button></details>
</main>
<script>
const D={overstap:false,base:"",station:"",best:"Rotterdam,Schiedam",mnaam:"Delfshaven",mcodes:""};
let S={...D};
try{S={...D,...JSON.parse(localStorage.getItem("treinapp")||"{}")}}catch(e){}
const $=id=>document.getElementById(id);
const ids=["base","station","best","mnaam","mcodes"];
ids.forEach(i=>$(i).value=S[i]);$("overstap").checked=!!S.overstap;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function opslaan(){ids.forEach(i=>S[i]=$(i).value.trim());S.overstap=$("overstap").checked;try{localStorage.setItem("treinapp",JSON.stringify(S))}catch(e){}}
function rij(t,detail,sub){
  const v=t.vertraging>0?`<span class="v">+${t.vertraging}</span>`:"";
  return `<div class="rij"><span class="t ${t.vervalt?"x":""}">${t.tijd}</span>${v}<span class="r">${detail}<div class="m">${sub}${t.vervalt?" · vervalt":""}</div></span></div>`;
}
function reisRij(t){
  const v=t.vertraging>0?`<span class="v">+${t.vertraging}</span>`:"";
  const o=t.overstappen===0?"direct":t.overstappen===1?"1 overstap":t.overstappen+" overstappen";
  const route=t.delen.map(l=>`${esc(l.soort)} ${esc(l.van)} → ${esc(l.naar)}`).join(" › ");
  const naar=S.best.includes(",")?" · "+esc(t.naar):"";
  return `<div class="rij"><span class="t ${t.vervalt?"x":""}">${t.vertrek}</span>${v}<span class="r">aankomst ${t.aankomst} · ${o}${naar}<div class="m">spoor ${esc(t.spoor)} · ${route}${t.vervalt?" · vervalt":""}</div></span></div>`;
}
async function haal(pad,q){
  const r=await fetch(S.base.replace(/\/$/,"")+pad+"?"+new URLSearchParams(q));
  const d=await r.json();if(d.fout)throw new Error(d.fout);return d;
}
function suggest(inp,dl,multi){
  let tm;
  inp.addEventListener("input",()=>{
    clearTimeout(tm);
    tm=setTimeout(async()=>{
      if(!S.base)return;
      const parts=multi?inp.value.split(","):[inp.value];
      const last=parts.pop().trim();
      if(last.length<2)return;
      const prefix=parts.map(s=>s.trim()).filter(Boolean).join(",")+(parts.length?",":"");
      try{const d=await haal("/stations",{q:last});
        dl.innerHTML=d.stations.map(n=>`<option value="${esc(prefix+n)}">`).join("")}catch(e){}
    },250);
  });
}
suggest($("station"),$("dl1"),false);suggest($("best"),$("dl2"),true);
async function ververs(){
  if(!S.base){$("inst").open=true;$("treinen").innerHTML='<div class="leeg">Vul eerst de Worker-URL in bij Instellingen.</div>';$("metros").innerHTML="";return}
  $("mh").textContent="Metro "+S.mnaam;
  const naar=S.best.split(",").map(s=>s.trim()).filter(Boolean).join(" / ");
  const taken=[];
  if(S.station&&S.overstap&&S.best){
    $("th").textContent=`Reizen van ${S.station} naar ${naar} (incl. overstap)`;
    taken.push(haal("/reis",{station:S.station,bestemming:S.best}).then(d=>{
      $("th").textContent=`Reizen van ${d.station} naar ${naar} (incl. overstap)`;
      $("treinen").innerHTML=d.reizen.length?d.reizen.map(reisRij).join(""):'<div class="leeg">Geen reizen gevonden.</div>';
    }).catch(e=>$("treinen").innerHTML=`<div class="fout">${esc(e.message)}</div>`));
  }else if(S.station){
    $("th").textContent=`Treinen van ${S.station} naar ${naar}`;
    taken.push(haal("/trein",{station:S.station,bestemming:S.best}).then(d=>{
      $("th").textContent=`Treinen van ${d.station} naar ${naar}`;
      $("treinen").innerHTML=d.vertrekken.length?d.vertrekken.map(t=>rij(t,"naar "+esc(t.richting),`spoor ${esc(t.spoor)} · ${esc(t.soort)}`)).join(""):'<div class="leeg">Geen treinen gevonden.</div>';
    }).catch(e=>$("treinen").innerHTML=`<div class="fout">${esc(e.message)}</div>`));
  }else{$("th").textContent="Treinen";$("treinen").innerHTML='<div class="leeg">Kies hierboven een startstation.</div>'}
  if(S.mcodes){
    taken.push(haal("/metro",{codes:S.mcodes}).then(d=>{
      $("metros").innerHTML=d.vertrekken.length?d.vertrekken.map(t=>rij(t,`lijn ${esc(t.lijn)} naar ${esc(t.richting)}`,t.perron?"perron "+esc(t.perron):"")).join(""):'<div class="leeg">Geen metro’s gevonden.</div>';
    }).catch(e=>$("metros").innerHTML=`<div class="fout">${esc(e.message)}</div>`));
  }else $("metros").innerHTML=`<div class="leeg">Vul bij Instellingen de metro-codes voor ${esc(S.mnaam)} in.</div>`;
  await Promise.all(taken);
  $("upd").textContent="Bijgewerkt om "+new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function zoek(){opslaan();ververs()}
$("zoek").onclick=zoek;
["station","best"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")zoek()}));
$("swap").onclick=()=>{
  const van=$("station").value,naar=$("best").value.split(",")[0].trim();
  $("station").value=naar;$("best").value=van;zoek();
};
$("opsl").onclick=()=>{opslaan();$("inst").open=false;ververs()};
ververs();setInterval(ververs,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ververs()});
</script>
</body>
</html>
